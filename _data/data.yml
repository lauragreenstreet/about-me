projects:
    title: Projects
    intro: |
    assignments:
      - title: Improving Bus Performance in New York City
        tagline: New York City buses are slow and unreliable. While transit systems collect large volumes of data on vehicles and riders, there is a gap in using this
                 data to inform operations. As a <a href="https://www.pi.tech.cornell.edu/pitech-phd-impact-fellowship">Siegel PiTech Fellow</a>, I developed a digital
                 twin using MTA Open Data that can compare a variety of interventions to understand design effective interventions and understand what factors drive performance. 
                 As an MTA intern, I tested the framework on internal data, finding that targeting bus spacing is often more effective than faster speeds or boardings.<br></br> 

      - title: Optimization for Fisheries Managements
        tagline: Fishery income is highly variable, where low income years can heavily impact small communities and result in millions of dollars of government support.
                 Diversification in multiple fisheries can reduce income variability, but fisherman may not diversify due to financial costs, difficultly obtaining 
                 new skills, or uncertainty about future risk. Working with fisheries ecologist Suresh Sethi, I developed an optimization framework to explore 
                 the relative impact of interventions targeted at each challenge. The optimization found there is potential to reduce income variance across the system
                 by over 50% and significant benefits to reducing barriers to obtaining new skills.<br></br>
        papers:
          - title: "Reducing Income Variability in Natural Resource Portfolios via Integer Programming"
            link: "https://link.springer.com/chapter/10.1007/978-3-031-95976-9_2"
            authors: Greenstreet, L, Q. Shi, M. Grimson, F.W. Simon, S.A. Sethi, ..., et al.
            conference: CPAIOR, 2025.

      - title: Mapping Aquaculture in the Amazon
        tagline: |
            Aquaculture, or the farming of aquatic organisms including fish and shellfish, has the potential to 
            create economic growth with lower land-use, freshwater use, and carbon emissions than traditional livestock. 
            Aquaculture is growing rapidly in the Amazon. However, the location, extent, and life-cycle of 
            operations are poorly understood. Working with Dr. Carla Gomes, I helped develop deep learning methods to 
            detect aquaculture ponds from medium resolution satellite data, using temporal information, attention, and
            contrastive learning to deal with issues including label imbalance, label bias, and generalization to new regions. 
            The model was used by to understand land use change and associated carbon emissions in the Brazilian Amazon.
            <br></br>
        papers:
          - title: "Towards sustainable aquaculture in the Amazon"
            link: "https://doi.org/10.1038/s41893-024-01500-w"
            authors: F.S. Pacheco, S.A. Heilpern, C. DiLeo, ..., L. Greenstreet, ..., et al.
            conference: Nature Sustainability, 2025.

          - title: "Detecting Aquaculture with Deep Learning in a Low-Data Setting"
            link: "https://www.cs.cornell.edu/gomes/pdf/2023_greenstreet_kdd_aquaculture.pdf"
            authors: Greenstreet, L, J. Fan, F. Siqueira Pacheco, Y. Bai, M. Eichemberger Ummus, ..., et al. 
            conference: SigKDD, Fragile Earth Workshop, 2023.


