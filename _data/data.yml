career-profile:
    title: About Me
    summary: |
       I’m a computer science PhD student at Cornell co-advised by <a href="https://people.orie.cornell.edu/shmoys/">David Shmoys</a> and 
       <a href="https://tech.cornell.edu/people/andrea-lodi/">Andrea Lodi</a>. I'm interested in building better decision making systems with optimization and machine learning 
       methods. Previously, I worked with <a href="https://www.cs.cornell.edu/gomes/">Carla Gomes</a> to develop methods to track aquaculture development from satellite imagery, 
       with <a href="https://ires.ubc.ca/claire-kremen/">Claire Kremen</a> on the first global analysis of functional connectivity, and with <a href="https://personal.math.ubc.ca/~geoff/">Geoffrey Schiebinger</a> 
       on optimization methods for single-cell genomics.
