projects:
    title: Recent Projects
    intro: |
    assignments:
      - title: Improving Bus Performance in New York City
        tagline: Buses in New York City are slow and unreliable. Through a Cornell Siegel PiTech fellowship in collaboration with the non-profit 
                 <a href="https://www.ridersalliance.org/">Riders Alliance</a>, I developed a simulation framework to discover what factors
                 drive long rider wait and trip times and compare five proposed improvements.<br></br> 
                 
                 Learn more about the project in
                  <a href="https://www.pi.tech.cornell.edu/spotlight/what-causes-bus-bunching-in-nyc-and-how-can-we-combat-it">this blog post.</a>

      - title: Optimization for Fisheries Management
        tagline: Fishery income is highly variable, where low income years can heavily impact small communities and result in millions of dollars of fedral support.
                 Diversification in multiple fisheries can reduce income variability, but fisherman may not diversify due to financial costs, difficultly obtaining 
                 necessary skills, or uncertainty about future risk. Working with fisheries ecologist <a href="https://cals.cornell.edu/people/suresh-sethi">Suresh Sethi</a>, 
                 I developed an optimization framework to explore the relative impact of interventions targeted at each challenge.<br></br>
                 
        papers:
          - title: "Reducing Income Variability in Natural Resource Portfolios via Integer Programming"
            link: "https://link.springer.com/chapter/10.1007/978-3-031-95976-9_2"
            authors: Greenstreet, L, Q. Shi, M. Grimson, F.W. Simon, S.A. Sethi, ..., et al.
            conference: CPAIOR, 2025.

      - title: Mapping Aquaculture in the Amazon
        tagline: |
            Aquaculture, or the farming or cultivation of aquatic organisms including fish and shellfish, has the potential to 
            create economic growth with lower land-use, freshwater use, and carbon emissions than traditional livestock. 
            Aquaculture is growing rapidly in the Amazon. However, the location, extent, and life-cycle of 
            operations are poorly understood. Working with Dr. Carla Gomes, I helped develop deep learning methods to 
            detect aquaculture ponds from medium resolution satellite data, using temporal information, attention, and
            contrastive learning to deal with issues including label imbalance, label bias, and generalization to new regions.
            <br></br>
        papers:
          - title: "Towards sustainable aquaculture in the Amazon"
            link: "https://doi.org/10.1038/s41893-024-01500-w"
            authors: F.S. Pacheco, S.A. Heilpern, C. DiLeo, ..., L. Greenstreet, ..., et al.
            conference: Nature Sustainability, 2025.

          - title: "Detecting Aquaculture with Deep Learning in a Low-Data Setting"
            link: "https://www.cs.cornell.edu/gomes/pdf/2023_greenstreet_kdd_aquaculture.pdf"
            authors: Greenstreet, L, J. Fan, F. Siqueira Pacheco, Y. Bai, M. Eichemberger Ummus, ..., et al. 
            conference: SigKDD, Fragile Earth Workshop, 2023.


